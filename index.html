<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#50808E" />
    <meta name="description" content="Gerto — gestão operacional, frota, finanças e contratos da ROAS Transfer." />
    <title>Gerto · ROAS Transfer</title>
    <script>
      // Aplica o tema salvo antes da renderização para evitar "flash" de cor.
      try {
        var t = localStorage.getItem('gerto:theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
